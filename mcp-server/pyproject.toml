[project]
name = "nano-pdf-mcp"
version = "0.1.0"
description = "NanoPDF MCP Server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14.0",
    "mcp>=1.0.0",
    "google-genai>=0.3.0",
    "pdf2image>=1.17.0",
    "pypdf>=3.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
nanopdf = "server:main" 

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
  "/.venv",
  "/tests",
  "*.pdf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
